name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DISABLE_SPRING: '1'
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fsp_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fsp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:prepare

      - name: Compile Rails stylesheet
        run: >-
          bundle exec rails runner
          'abort "application.css did not compile" unless
          Rails.application.assets.find_asset("application.css")'

      - name: Run Rails tests
        run: bundle exec rails test --verbose

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build frontend bundle
        run: npm run build
        env:
          NODE_ENV: production
